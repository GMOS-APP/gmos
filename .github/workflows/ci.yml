name: CI

# Required checks on main: `verify` and `functions` (plus `risk-gate` from
# automerge.yml). Vercel builds previews and production on its own; branch
# protection is what keeps a red build from reaching main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # lint → typecheck ratchet → vitest → migration/changelog checks → build
      - run: npm run verify
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Browser smoke tests against the build verify just made (e2e/, playwright.config.js).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  functions:
    name: functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node scripts/typecheck-ratchet.mjs --target functions

  # Applies new migrations to a local Supabase stack loaded with a snapshot of the production schema
  # (supabase/schema/prod-schema.sql, refreshed by schema-snapshot.yml), so broken SQL fails here instead of
  # in the production deploy. Always reports a result, so it can be a required check; the work only runs
  # when migrations, the snapshot or the Supabase config change.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Anything to test?
        id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE="$(git rev-parse HEAD~1)"; fi
          if git diff --name-only "$BASE" HEAD -- supabase/migrations supabase/schema supabase/config.toml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration changes: nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v3
        if: steps.changes.outputs.run == 'true'
        with:
          version: 3.4.0
      - name: Start a local stack
        if: steps.changes.outputs.run == 'true'
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,mailpit,postgres-meta
      - name: Load the production schema, then apply newer migrations
        if: steps.changes.outputs.run == 'true'
        run: |
          SNAP=supabase/schema/prod-schema.sql
          if [ ! -f "$SNAP" ]; then
            echo "::warning::No $SNAP yet: run the 'Schema snapshot' workflow. Migrations were not tested."
            exit 0
          fi
          SNAPV="$(sed -n 's/^-- snapshot-version: \([0-9]\{14\}\).*/\1/p' "$SNAP" | head -1)"
          SNAPV="${SNAPV:-0}"
          echo "Loading $SNAP (production as of migration $SNAPV)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$SNAP"
          applied=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            v="$(basename "$f" | cut -c1-14)"
            head -n 1 "$f" | grep -q '^-- baseline:' && continue
            [ "$v" -le "$SNAPV" ] && continue
            echo "::group::Applying $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -1 -f "$f"
            echo "::endgroup::"
            applied=$((applied + 1))
          done
          echo "Applied $applied migration(s) newer than the snapshot."
      - name: Lint the resulting schema
        if: steps.changes.outputs.run == 'true'
        run: supabase db lint --level error --fail-on none
