name: Production smoke test

# After Vercel reports a successful Production deployment, check that the live
# site responds. On failure, open a `prod-incident` issue. Rollback stays a
# human decision (Vercel → Deployments → Instant Rollback).
on:
  deployment_status:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://gmos.app
    steps:
      - name: Check live endpoints
        run: |
          check() { # url, expected substring
            for i in 1 2 3 4 5 6; do
              body="$(curl -fsSL --max-time 20 "$1" 2>/dev/null)" && printf '%s' "$body" | grep -q "$2" && { echo "ok  $1"; return 0; }
              sleep 20
            done
            echo "FAIL $1 (expected '$2')"; return 1
          }
          fail=0
          check "$SITE/" 'id="root"' || fail=1
          check "$SITE/sitemap.xml" '<urlset' || fail=1
          check "$SITE/rss.xml" '<rss' || fail=1
          exit $fail

      - name: Open incident
        if: failure()
        run: |
          gh label create prod-incident -R "$GITHUB_REPOSITORY" --color B60205 --description "Production smoke test failed" 2>/dev/null || true
          gh issue create -R "$GITHUB_REPOSITORY" --label prod-incident \
            --title "Production smoke test failed for ${GITHUB_SHA::7}" \
            --body "The smoke test failed after deployment of ${{ github.event.deployment.sha }} (${{ github.event.deployment_status.environment_url }}). See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Consider an instant rollback in Vercel."
