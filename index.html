<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA / installable app -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" (not "black-translucent") so iOS keeps the app below the status
         bar / Dynamic Island instead of drawing behind it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="GM/OS" />
    <title>GM/OS — The operating system for Game Masters</title>
    <meta name="description" content="GM/OS is a dedicated space for Game Masters to keep a campaign in one place and run their sessions — NPCs, locations, prep, notes, initiative, and dice." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GM/OS — A dedicated space for Game Masters" />
    <meta property="og:description" content="Keep your campaign in one place and run your sessions: NPCs, locations, session prep, notes, initiative, and dice." />
    <link rel="canonical" href="https://gmos.app/" />
    <link rel="alternate" type="application/rss+xml" title="GM/OS Blog" href="https://gmos.app/rss.xml" />
    <meta property="og:url" content="https://gmos.app/" />
    <meta property="og:image" content="https://gmos.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GM/OS — A dedicated space for Game Masters" />
    <meta name="twitter:description" content="Keep your campaign in one place and run your sessions — a dedicated space for Game Masters." />
    <meta name="twitter:image" content="https://gmos.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
    <script>
      // Apply saved theme before React loads to prevent flash
      (function() {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
